<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🛡</span>
        <h1>SafeTranslate</h1>
      </div>
      <label class="toggle" aria-label="啟用/停用">
        <input type="checkbox" id="globalToggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </header>

    <!-- Status -->
    <div class="status-card" id="statusCard">
      <div class="status-indicator idle" id="statusIndicator"></div>
      <div class="status-text">
        <span id="statusLabel">監控中</span>
        <span class="status-detail" id="statusDetail">等待偵測翻譯活動</span>
      </div>
    </div>

    <!-- Protection Mode -->
    <section class="section">
      <h2>保護模式</h2>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="mode" value="patchOnly" checked>
          <div class="radio-content">
            <span class="radio-label">修補模式（推薦）</span>
            <span class="radio-desc">修補 DOM 方法，允許 Chrome 翻譯正常運作而不崩潰</span>
          </div>
        </label>
        <label class="radio-option">
          <input type="radio" name="mode" value="blockAndTooltip">
          <div class="radio-content">
            <span class="radio-label">攔截模式</span>
            <span class="radio-desc">阻止 Chrome 翻譯，改用選取文字的安全翻譯提示</span>
          </div>
        </label>
      </div>
    </section>

    <!-- Stats -->
    <div class="section stats">
      <div class="stat">
        <span class="stat-value" id="protectionCount">0</span>
        <span class="stat-label">次保護</span>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>v1.0.0</span>
    </footer>
  </div>

  <script src="../lib/constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
