<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🛡</span>
        <h1>SafeTranslate</h1>
      </div>
      <label class="toggle" aria-label="啟用/停用">
        <input type="checkbox" id="globalToggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </header>

    <!-- Status -->
    <div class="status-card">
      <div class="status-indicator idle" id="statusIndicator"></div>
      <div class="status-text">
        <span id="statusLabel">監控中</span>
        <span class="status-detail" id="statusDetail">等待偵測翻譯活動</span>
      </div>
    </div>

    <section class="section">
      <h2>翻譯設定</h2>
      <div class="panel settings-panel">
        <div class="field-grid">
          <div class="field-group field-span-2">
            <label class="field-label" for="targetLanguageSelect">目標語言</label>
            <select id="targetLanguageSelect" class="select-field">
              <option value="zh-TW">繁體中文</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="ko">한국어</option>
              <option value="fr">Français</option>
              <option value="de">Deutsch</option>
              <option value="es">Español</option>
              <option value="pt">Português</option>
              <option value="ru">Русский</option>
              <option value="it">Italiano</option>
              <option value="th">ไทย</option>
              <option value="vi">Tiếng Việt</option>
            </select>
          </div>
          <div class="field-group field-span-2">
            <label class="field-label" for="providerSelect">翻譯引擎</label>
            <select id="providerSelect" class="select-field">
              <option value="builtIn">Chrome Built-in AI</option>
              <option value="openaiCompatible">OpenAI Compatible API</option>
              <option value="ollama">Ollama</option>
            </select>
            <p class="field-hint" id="providerHint">優先使用本機 Translator API，在支援裝置上可離線運作。</p>
          </div>
          <div class="field-group field-span-2" id="builtInStatusGroup">
            <div class="provider-status-row">
              <span class="field-label">Chrome AI 狀態</span>
              <button type="button" class="provider-status-chip provider-status-button idle" id="builtInStatusChip">點擊檢查</button>
            </div>
            <p class="field-hint" id="builtInStatusDetail">按一下右側按鈕後，才會對目前分頁執行一次 Chrome 內建 AI 狀態檢查。</p>
          </div>
          <div class="field-group field-span-2 provider-field" id="providerBaseGroup">
            <label class="field-label" for="providerBaseUrlInput">Base URL</label>
            <input id="providerBaseUrlInput" class="text-field" type="url" placeholder="https://api.example.com/v1">
          </div>
          <div class="field-group field-span-2 provider-field" id="providerModelGroup">
            <label class="field-label" for="providerModelInput">Model</label>
            <input id="providerModelInput" class="text-field" type="text" placeholder="gpt-4.1-mini">
          </div>
          <div class="field-group field-span-2 provider-field" id="providerApiKeyGroup">
            <label class="field-label" for="providerApiKeyInput">API Key</label>
            <input id="providerApiKeyInput" class="text-field" type="password" placeholder="只儲存在目前裝置">
          </div>
        </div>
        <div class="switch-row">
          <div>
            <span class="switch-label">自動翻譯頁面內容</span>
            <p class="field-hint">在目前分頁自動翻譯可見文字區塊到目標語言。</p>
          </div>
          <label class="toggle toggle-compact" aria-label="自動翻譯頁面內容">
            <input type="checkbox" id="autoTranslateToggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </section>

    <!-- Protection Mode -->
    <section class="section">
      <h2>保護模式</h2>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="mode" value="patchOnly" checked>
          <div class="radio-content">
            <span class="radio-label">修補模式（推薦）</span>
            <span class="radio-desc">修補 DOM 方法，允許 Chrome 翻譯正常運作而不崩潰</span>
          </div>
        </label>
        <label class="radio-option">
          <input type="radio" name="mode" value="blockAndTooltip">
          <div class="radio-content">
            <span class="radio-label">攔截模式</span>
            <span class="radio-desc">阻止 Chrome 翻譯，改用選取文字的安全翻譯提示</span>
          </div>
        </label>
      </div>
    </section>

    <section class="section">
      <h2>目前網站</h2>
      <div class="panel site-panel">
        <div class="row-text">
          <span class="panel-label">網站</span>
          <span class="panel-value" id="siteHost">未偵測</span>
        </div>
        <label class="field-label" for="siteModeSelect">此網站策略</label>
        <select id="siteModeSelect" class="select-field">
          <option value="inherit">跟隨全域設定</option>
          <option value="patchOnly">強制修補模式</option>
          <option value="blockAndTooltip">強制攔截模式</option>
        </select>
        <label class="field-label" for="siteTranslationSelect">此網站翻譯</label>
        <select id="siteTranslationSelect" class="select-field">
          <option value="inherit">跟隨全域設定</option>
          <option value="never">絕不翻譯此網站</option>
        </select>
        <p class="field-hint">站點策略會在目前網站優先於全域模式生效。必要時請重新整理頁面。</p>
      </div>
    </section>

    <section class="section">
      <h2>診斷</h2>
      <div class="panel diagnostics-grid">
        <div class="diag-item">
          <span class="diag-label">版本</span>
          <span class="diag-value" id="diagVersion">-</span>
        </div>
        <div class="diag-item">
          <span class="diag-label">偵測原因</span>
          <span class="diag-value" id="diagReason">-</span>
        </div>
        <div class="diag-item">
          <span class="diag-label">removeChild</span>
          <span class="diag-value" id="diagRemove">0</span>
        </div>
        <div class="diag-item">
          <span class="diag-label">insertBefore</span>
          <span class="diag-value" id="diagInsert">0</span>
        </div>
        <div class="diag-item">
          <span class="diag-label">replaceChild</span>
          <span class="diag-value" id="diagReplace">0</span>
        </div>
        <div class="diag-item diag-item-full">
          <span class="diag-label">最後處理錯誤</span>
          <span class="diag-value diag-value-wrap" id="diagLastError">-</span>
        </div>
      </div>
    </section>

    <!-- Stats -->
    <div class="section stats">
      <div class="stat">
        <span class="stat-value" id="protectionCount">0</span>
        <span class="stat-label">次保護</span>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span id="footerVersion">v1.0.0</span>
    </footer>
  </div>

  <script src="../lib/constants.js"></script>
  <script src="../lib/site-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
